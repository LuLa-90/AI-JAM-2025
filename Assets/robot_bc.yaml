
behaviors:
  RobotAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    behavioral_cloning:
      demo_path: C:/Users/Kubig/source/repos/LuLa-90/AI-JAM-2025/Assets/Demonstrations/DemoCombatFinal.demo
      strength: 1.0
      steps: 50000
      batch_size: 128
      num_epoch: 3

    max_steps: 5.0e6
    time_horizon: 64
    summary_freq: 5000
    checkpoint_interval: 500000
    threaded: false
